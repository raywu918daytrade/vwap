name: Patch initial chart selection
on:
  push:
    branches: [initial-page-no-stock-load]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: initial-page-no-stock-load
      - name: Patch App.jsx
        run: python scripts/patch_initial_chart_selection.py
      - name: Commit source change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/App.jsx
          git commit -m "Do not auto-load stock chart on page open"
          git push origin HEAD:initial-page-no-stock-load
