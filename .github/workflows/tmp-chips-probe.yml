name: tmp chips probe
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/tmp-chips-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install huggingface_hub pandas pyarrow
      - name: Probe
        run: |
          mkdir -p tmp-charts
          python - <<'PY' 2>&1 | tee tmp-charts/chips_probe.log
          from huggingface_hub import HfApi, hf_hub_download
          import pandas as pd, collections
          api = HfApi()
          repo = "raywu918python/j1s-data"
          files = api.list_repo_files(repo, repo_type="dataset")
          print("total files", len(files))
          tops = collections.Counter("/".join(f.split("/")[:2]) for f in files)
          for k, v in sorted(tops.items()): print("dir", k, v)
          for d in ("db/margin", "db/ib"):
              fs = sorted(f for f in files if f.startswith(d + "/"))
              print("\n==", d, len(fs), "first", fs[:5], "last", fs[-5:])
              for f in [fs[0], fs[-1]]:
                  p = hf_hub_download(repo, f, repo_type="dataset")
                  df = pd.read_parquet(p) if f.endswith(".parquet") else pd.read_csv(p)
                  print("\n--", f, df.shape)
                  print(df.dtypes.to_string())
                  print(df.head(5).to_string())
                  for c in df.columns:
                      if "date" in c.lower() or c.lower() in ("dt", "time"):
                          print("range", c, df[c].min(), df[c].max(), df[c].nunique())
          PY
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add tmp-charts && git commit -m "tmp chips probe"
          git push origin HEAD:${{ github.ref_name }}
