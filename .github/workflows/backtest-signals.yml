name: Backtest Signals

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Months of M1 history to download and backtest."
        required: false
        default: "3"
        type: string
      extra_args:
        description: "Extra args for scripts.backtest_signals, e.g. --tp 1.5 --sl 1 --cost 0.3"
        required: false
        default: ""
        type: string
  push:
    branches:
      - "claude/**"
    paths:
      - backend/scripts/backtest_signals.py
      - .github/workflows/backtest-signals.yml

concurrency:
  group: backtest-signals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    name: Backtest offline signals
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      HF_REPO_ID: ${{ secrets.HF_REPO_ID || vars.HF_REPO_ID || 'raywu918daytrade/daytrade' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
      MONTHS: ${{ inputs.months || '3' }}
      EXTRA_ARGS: ${{ inputs.extra_args || '' }}
      # Optional fixed window (YYYY-MM-DD) for out-of-sample checks; overrides MONTHS for the date range.
      FROM_DATE_FIXED: "2026-04-01"
      TO_DATE_FIXED: "2026-06-30"
      SYNC_MONTHS: "8"
      # 1 = recompute signals/activity for the fixed window on the runner (never uploaded).
      BUILD_SIGNALS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Download signals and M1 bars
        working-directory: backend
        run: |
          python -m scripts.sync_market_db_from_hf \
            --only m1 m5_std d1 adjustment_day tickers adjustment_factor tick_adjust_factor vwap_signals vwap_activity d1_flags adjustment_day_flags \
            --history-months 14 \
            --intraday-months "${SYNC_MONTHS:-$((MONTHS + 1))}" \
            --no-prune

      - name: Rebuild signals for the fixed window (local only, not uploaded)
        if: ${{ env.BUILD_SIGNALS == '1' }}
        working-directory: backend
        run: |
          python -m scripts.build_vwap_activity --from-date "${FROM_DATE_FIXED}" --to-date "${TO_DATE_FIXED}"
          python -m scripts.build_vwap_signals --from-date "${FROM_DATE_FIXED}" --to-date "${TO_DATE_FIXED}"

      - name: Run backtest
        working-directory: backend
        run: |
          FROM_DATE="${FROM_DATE_FIXED:-$(TZ=Asia/Taipei date -d "${MONTHS} months ago" +%F)}"
          TO_ARGS=()
          if [ -n "${TO_DATE_FIXED:-}" ]; then TO_ARGS=(--to-date "${TO_DATE_FIXED}"); fi
          python -m scripts.backtest_signals --from-date "${FROM_DATE}" "${TO_ARGS[@]}" --out-dir db/backtest ${EXTRA_ARGS}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-signals
          path: backend/db/backtest/
          if-no-files-found: ignore
