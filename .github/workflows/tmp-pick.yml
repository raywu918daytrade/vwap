name: tmp pick
# climax scan pr50 v7 pullback near-stop 2024-26 2020-2026
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/tmp-pick.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        year: ["2024", "2025", "2026"]
    permissions:
      contents: write
    env:
      HF_REPO_ID: ${{ secrets.HF_REPO_ID || vars.HF_REPO_ID || 'raywu918daytrade/daytrade' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Download
        working-directory: backend
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          y = os.environ["YEAR"]
          pats = [f"db/{f}/*" for f in ("adjustment_day", "adjustment_factor", "tick_adjust_factor", "tickers", "d1", "d1_flags", "adjustment_day_flags")]
          pats.append(f"db/m1/{y}_*")
          snapshot_download(os.environ["HF_REPO_ID"], repo_type="dataset", local_dir=".", allow_patterns=pats,
                            token=os.environ.get("HF_TOKEN") or None)
          PY
      - name: Build
        working-directory: backend
        env:
          YEAR: ${{ matrix.year }}
        run: |
          mkdir -p out
          python -m scripts.m1_pullback_scan --days ../tmp-charts/pr50_days.parquet --year $YEAR --out out/pullback_$YEAR.parquet 2>&1 | tee out/pullback_$YEAR.log
      - name: Commit
        if: always()
        run: |
          mkdir -p tmp-charts && cp backend/out/* tmp-charts/ || true
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add tmp-charts && git commit -m "tmp pick ${{ matrix.year }}"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*9)); done
