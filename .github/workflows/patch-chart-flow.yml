name: Patch chart flow
on:
  push:
    branches: [date-stock-flow]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: date-stock-flow
      - name: Patch App.jsx
        run: python scripts/patch_chart_flow.py
      - name: Commit source change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/App.jsx
          git commit -m "Separate date and stock chart loading"
          git push origin HEAD:date-stock-flow
