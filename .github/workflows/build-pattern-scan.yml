name: Build Offline Signals

on:
  schedule:
    # Backup trigger: 14:00 Asia/Taipei = 06:00 UTC, weekdays.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional trading date YYYY-MM-DD. Empty means today in Asia/Taipei."
        required: false
        type: string
      init_months:
        description: "Optional one-time init window in months, for example 3."
        required: false
        type: string
      force:
        description: "Rebuild even when the target date is already complete in TiDB."
        required: false
        default: false
        type: boolean

concurrency:
  group: offline-signals
  cancel-in-progress: false

jobs:
  build-offline-signals:
    name: Build and upload offline signal shards
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_REPO_ID: ${{ secrets.HF_REPO_ID || vars.HF_REPO_ID || 'raywu918daytrade/daytrade' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
      TIDB_DAY_TRADE_DATABASE_URL: ${{ secrets.TIDB_DAY_TRADE_DATABASE_URL }}
      TIDB_DAY_TRADE_HOST: ${{ secrets.TIDB_DAY_TRADE_HOST }}
      TIDB_DAY_TRADE_PORT: ${{ secrets.TIDB_DAY_TRADE_PORT }}
      TIDB_DAY_TRADE_USER: ${{ secrets.TIDB_DAY_TRADE_USER }}
      TIDB_DAY_TRADE_PASSWORD: ${{ secrets.TIDB_DAY_TRADE_PASSWORD }}
      TIDB_DAY_TRADE_DATABASE: ${{ secrets.TIDB_DAY_TRADE_DATABASE }}
      TIDB_DAY_TRADE_SSL_CA: ${{ secrets.TIDB_DAY_TRADE_SSL_CA }}
      TIDB_DAY_TRADE_PUBLIC_KEY: ${{ secrets.TIDB_DAY_TRADE_PUBLIC_KEY }}
      TIDB_DAY_TRADE_PRIVATE_KEY: ${{ secrets.TIDB_DAY_TRADE_PRIVATE_KEY }}
      TARGET_DATE: ${{ inputs.date }}
      INIT_MONTHS: ${{ inputs.init_months }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Resolve target date
        id: target
        shell: bash
        run: |
          if [ -n "${TARGET_DATE:-}" ]; then
            echo "date=${TARGET_DATE}" >> "${GITHUB_OUTPUT}"
          else
            echo "date=$(TZ=Asia/Taipei date +%F)" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check whether target is already complete
        id: guard
        if: ${{ inputs.init_months == '' && inputs.force != true }}
        working-directory: backend
        shell: bash
        run: |
          if python -m scripts.check_offline_signals_complete --date "${{ steps.target.outputs.date }}"; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Target is already complete; this duplicate trigger will exit."
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download market DB inputs
        if: ${{ steps.guard.outputs.skip != 'true' }}
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          SYNC_INTRADAY_MONTHS=4
          if [[ "${INIT_MONTHS:-}" =~ ^[0-9]+$ ]]; then
            SYNC_INTRADAY_MONTHS=$((INIT_MONTHS + 3))
            if [ "${SYNC_INTRADAY_MONTHS}" -lt 6 ]; then
              SYNC_INTRADAY_MONTHS=6
            fi
          fi
          python -m scripts.sync_market_db_from_hf \
            --only m1 m5_std d1 adjustment_day tickers adjustment_factor tick_adjust_factor pattern_scan vwap_activity vwap_signals d1_flags adjustment_day_flags \
            --intraday-months "${SYNC_INTRADAY_MONTHS}" \
            --history-months 12 \
            --no-prune

      - name: Build and upload offline parquet
        if: ${{ steps.guard.outputs.skip != 'true' }}
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          TIDB_ARGS=()
          TIDB_SYNC_ENABLED=0
          if [ -n "${TIDB_DAY_TRADE_DATABASE_URL:-}" ] || {
            [ -n "${TIDB_DAY_TRADE_HOST:-}" ] &&
            [ -n "${TIDB_DAY_TRADE_USER:-}" ] &&
            [ -n "${TIDB_DAY_TRADE_PASSWORD:-}" ] &&
            [ -n "${TIDB_DAY_TRADE_DATABASE:-}" ]
          }; then
            TIDB_ARGS+=(--sync-tidb)
            TIDB_SYNC_ENABLED=1
          elif [ -n "${TIDB_DAY_TRADE_PUBLIC_KEY:-}" ] || [ -n "${TIDB_DAY_TRADE_PRIVATE_KEY:-}" ]; then
            echo "TiDB Data Service keys are present, but direct TiDB connection vars are missing; skip bulk TiDB sync."
          else
            echo "TiDB direct connection not configured; skip TiDB sync."
          fi
          if [ -n "${INIT_MONTHS:-}" ]; then
            python -m scripts.build_pattern_scan --init-months "${INIT_MONTHS}" --upload "${TIDB_ARGS[@]}"
            python -m scripts.build_vwap_activity --init-months "${INIT_MONTHS}" --upload "${TIDB_ARGS[@]}"
            python -m scripts.build_vwap_signals --init-months "${INIT_MONTHS}" --upload "${TIDB_ARGS[@]}"
            if [ "${TIDB_SYNC_ENABLED}" = "1" ]; then
              python -m scripts.sync_chart_to_tidb --init-months "${INIT_MONTHS}" --timeframe all
            fi
          elif [ -n "${TARGET_DATE:-}" ]; then
            python -m scripts.build_pattern_scan --date "${TARGET_DATE}" --upload "${TIDB_ARGS[@]}"
            python -m scripts.build_vwap_activity --date "${TARGET_DATE}" --upload "${TIDB_ARGS[@]}"
            python -m scripts.build_vwap_signals --date "${TARGET_DATE}" --upload "${TIDB_ARGS[@]}"
            if [ "${TIDB_SYNC_ENABLED}" = "1" ]; then
              python -m scripts.sync_chart_to_tidb --date "${TARGET_DATE}" --timeframe all
            fi
          else
            TARGET="${{ steps.target.outputs.date }}"
            FROM_DATE="$(date -u -d "${TARGET} - 7 days" +%F)"
            python -m scripts.build_pattern_scan --from-date "${FROM_DATE}" --to-date "${TARGET}" --upload "${TIDB_ARGS[@]}"
            python -m scripts.build_vwap_activity --from-date "${FROM_DATE}" --to-date "${TARGET}" --upload "${TIDB_ARGS[@]}"
            python -m scripts.build_vwap_signals --from-date "${FROM_DATE}" --to-date "${TARGET}" --upload "${TIDB_ARGS[@]}"
            if [ "${TIDB_SYNC_ENABLED}" = "1" ]; then
              python -m scripts.sync_chart_to_tidb --from-date "${FROM_DATE}" --to-date "${TARGET}" --timeframe all
            fi
          fi
