name: tmp exit study
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/tmp-exit-study.yml"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      HF_REPO_ID: ${{ secrets.HF_REPO_ID || vars.HF_REPO_ID || 'raywu918daytrade/daytrade' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Download
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          pats = [f"db/m1/{y}_*.parquet" for y in (2023, 2024, 2025, 2026)]
          snapshot_download(os.environ["HF_REPO_ID"], repo_type="dataset", local_dir=".", allow_patterns=pats,
                            token=os.environ.get("HF_TOKEN") or None)
          PY
      - name: Run
        working-directory: backend
        run: python -m scripts.exit_study --signals scripts/exit_signals.csv --out db/exit_study.md
      - name: Commit
        if: always()
        run: |
          mkdir -p tmp-charts && cp backend/db/exit_study.* tmp-charts/ || true
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add tmp-charts && git commit -m "tmp exit study" && git push origin HEAD:${{ github.ref_name }}
