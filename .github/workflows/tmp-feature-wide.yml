name: tmp feature table wide
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/tmp-feature-wide.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        year: [2020, 2021, 2022, 2023, 2024, 2025, 2026]
    env:
      HF_REPO_ID: ${{ secrets.HF_REPO_ID || vars.HF_REPO_ID || 'raywu918daytrade/daytrade' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Download
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          y = ${{ matrix.year }}
          pats = [f"db/m1/{y}_*.parquet", f"db/m1/{y-1}_12.parquet"]
          pats += [f"db/{f}/*" for f in ("adjustment_day", "adjustment_factor", "tick_adjust_factor", "tickers", "d1", "d1_flags", "adjustment_day_flags")]
          if y == 2026:
              pats.append("db/vwap_activity/*")
          snapshot_download(os.environ["HF_REPO_ID"], repo_type="dataset", local_dir=".", allow_patterns=pats,
                            token=os.environ.get("HF_TOKEN") or None)
          PY
          ls db/m1
      - name: Build
        working-directory: backend
        run: |
          last=12; [ "${{ matrix.year }}" = "2026" ] && last=10
          y=${{ matrix.year }}
          python -m scripts.build_feature_table_long --from-month $y-01 --to-month $y-$last \
            --out db/tp_$y.parquet --min-atr 0.03 --min-pr 0.3 2>&1 | tee db/ft_$y.log
          python -m scripts.build_feature_table_long --from-month $y-01 --to-month $y-$last \
            --out db/hold_$y.parquet --tp 0 --min-atr 0.03 --min-pr 0.3 2>&1 | tail -2 | tee -a db/ft_$y.log
          python - <<PY
          import pandas as pd
          a = pd.read_parquet("db/tp_$y.parquet"); b = pd.read_parquet("db/hold_$y.parquet")
          b = b[["date", "stock_id", "time", "long_net", "short_net"]].rename(columns={"long_net": "long_hold", "short_net": "short_hold"})
          m = a.merge(b, on=["date", "stock_id", "time"], how="left")
          print("merged", len(a), len(m), m["short_hold"].notna().mean())
          m.to_parquet("db/ft_$y.parquet", index=False, compression="zstd")
          PY
      - name: Commit
        if: always()
        run: |
          mkdir -p tmp-charts && cp backend/db/ft_${{ matrix.year }}.* tmp-charts/ || true
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add tmp-charts && git commit -m "tmp feature wide ${{ matrix.year }}"
          for i in 1 2 3 4 5 6; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*7)); done
