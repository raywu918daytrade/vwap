name: tmp market context
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/tmp-market-ctx.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    env:
      HF_REPO_ID: ${{ secrets.HF_REPO_ID || vars.HF_REPO_ID || 'raywu918daytrade/daytrade' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pandas pyarrow huggingface_hub
      - name: Download
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(os.environ["HF_REPO_ID"], repo_type="dataset", local_dir=".",
                            allow_patterns=["db/m1/*.parquet", "db/tickers/*", "db/info/*"],
                            token=os.environ.get("HF_TOKEN") or None)
          PY
          python -c "import pandas as pd; t=pd.read_parquet('db/info/info.parquet'); print(t.columns.tolist()); print(t.head(3).to_string())" || true
      - name: Build
        working-directory: backend
        run: python -m scripts.build_market_features --from-month 2020-01 --to-month 2026-10 --out-dir db/market_ctx 2>&1 | tee db/market_ctx.log
      - name: Commit
        if: always()
        run: |
          mkdir -p tmp-charts && cp backend/db/market_ctx/* backend/db/market_ctx.log tmp-charts/ || true
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add tmp-charts && git commit -m "tmp market ctx" && git push origin HEAD:${{ github.ref_name }}
