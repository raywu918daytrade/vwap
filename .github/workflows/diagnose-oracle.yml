name: Diagnose Oracle Live Market

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  schedule:
    - cron: "45 5 * * 1-5"

permissions:
  contents: read
  issues: write

concurrency:
  group: oracle-vwap-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request == null &&
       github.event.issue.title == 'Oracle 盤中診斷' &&
       github.event.comment.body == '/diagnose' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORACLE_HOST: ${{ vars.ORACLE_HOST || '129.225.130.75' }}
      ORACLE_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
      ORACLE_PORT: ${{ vars.ORACLE_PORT || '22' }}
      ORACLE_DEPLOY_PATH: ${{ vars.ORACLE_DEPLOY_PATH || '/home/ubuntu/vwap' }}

    steps:
      - name: Configure SSH
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${ORACLE_SSH_PRIVATE_KEY}" || {
            echo "::error::Missing ORACLE_SSH_PRIVATE_KEY"
            exit 1
          }
          install -d -m 700 ~/.ssh
          printf '%s\n' "${ORACLE_SSH_PRIVATE_KEY}" > ~/.ssh/oracle_vwap
          chmod 600 ~/.ssh/oracle_vwap
          if [ -n "${ORACLE_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${ORACLE_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${ORACLE_PORT}" -H "${ORACLE_HOST}" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Collect sanitized diagnostics
        id: collect
        run: |
          set +e
          remote_env="$(printf 'DEPLOY_PATH=%q' "${ORACLE_DEPLOY_PATH}")"
          ssh -i ~/.ssh/oracle_vwap \
            -p "${ORACLE_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${ORACLE_USER}@${ORACLE_HOST}" \
            "${remote_env} bash -s" > diagnostic.json <<'REMOTE'
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          docker compose -f docker-compose.oracle.yml exec -T backend python - <<'PY'
          from __future__ import annotations

          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          import pandas as pd

          TW = ZoneInfo("Asia/Taipei")
          now = datetime.now(TW)
          today = now.strftime("%Y-%m-%d")

          def endpoint(path: str):
              return endpoint_url(f"http://127.0.0.1:8000{path}")

          def endpoint_url(url: str, host: str | None = None):
              try:
                  request = Request(url, headers={"Host": host} if host else {})
                  with urlopen(request, timeout=10) as response:
                      return json.load(response), None
              except Exception as exc:
                  return None, type(exc).__name__

          def scalar(value):
              if value is None or pd.isna(value):
                  return None
              if hasattr(value, "item"):
                  value = value.item()
              return value

          def safe_event(kind: str, row: dict) -> dict:
              return {
                  "kind": kind,
                  "time": str(row.get("time") or ""),
                  "stock_id": str(row.get("stock_id") or ""),
                  "name": str(row.get("name") or "")[:40],
                  "direction": str(row.get("direction") or row.get("vwap_dir") or ""),
                  "sr_kind": str(row.get("sr_kind") or ""),
                  "price": scalar(row.get("price")),
                  "vwap": scalar(row.get("vwap")),
              }

          health, health_error = endpoint("/health")
          gateway, gateway_error = endpoint_url("http://caddy/health", host="localhost")
          bundle, bundle_error = endpoint("/vwap_signal/bundle?universe=daytrade&repeat=1")

          m1 = {
              "file_exists": False,
              "rows": 0,
              "stocks": 0,
              "minutes": 0,
              "first_minute": None,
              "latest_minute": None,
              "latest_minute_stocks": 0,
              "latest_delay_seconds": None,
              "freshness_ok": False,
              "missing_market_minutes_count": 0,
              "missing_market_minutes": [],
              "quote_0050": None,
              "error": None,
          }
          live_path = Path(f"/app/db/m1_live/{today}.parquet")
          if live_path.exists():
              m1["file_exists"] = True
              try:
                  frame = pd.read_parquet(live_path)
                  if not frame.empty and "date" in frame.columns:
                      times = pd.to_datetime(frame["date"], errors="coerce")
                      frame = frame.loc[times.notna()].copy()
                      times = times.loc[times.notna()]
                      frame["_minute"] = times.dt.strftime("%Y-%m-%d %H:%M:00")
                      today_frame = frame[frame["_minute"].str.startswith(today)]
                      if not today_frame.empty:
                          minute_counts = today_frame.groupby("_minute")["stock_id"].nunique()
                          latest = str(minute_counts.index.max())
                          latest_dt = datetime.strptime(latest, "%Y-%m-%d %H:%M:%S").replace(tzinfo=TW)
                          m1.update({
                              "rows": int(len(today_frame)),
                              "stocks": int(today_frame["stock_id"].astype(str).nunique()),
                              "minutes": int(len(minute_counts)),
                              "first_minute": str(minute_counts.index.min()),
                              "latest_minute": latest,
                              "latest_minute_stocks": int(minute_counts.loc[latest]),
                              "latest_delay_seconds": max(0, int((now - latest_dt).total_seconds())),
                          })
                          session_start = datetime(now.year, now.month, now.day, 9, 0, tzinfo=TW)
                          session_end = datetime(now.year, now.month, now.day, 13, 29, tzinfo=TW)
                          if now < session_start:
                              m1["freshness_ok"] = latest_dt.date() == now.date()
                          elif now <= session_end + timedelta(minutes=3):
                              m1["freshness_ok"] = m1["latest_delay_seconds"] <= 180
                          else:
                              m1["freshness_ok"] = latest_dt >= session_end - timedelta(minutes=4)
                          completed = min(now.replace(second=0, microsecond=0) - timedelta(minutes=1), session_end)
                          if completed >= session_start:
                              expected = {
                                  dt.strftime("%Y-%m-%d %H:%M:00")
                                  for dt in pd.date_range(session_start, completed, freq="min")
                              }
                              observed = set(minute_counts.index.astype(str))
                              missing = sorted(expected - observed)
                              m1["missing_market_minutes_count"] = len(missing)
                              m1["missing_market_minutes"] = missing[-30:]
                          quote_rows = today_frame[today_frame["stock_id"].astype(str) == "0050"]
                          if not quote_rows.empty:
                              row = quote_rows.sort_values("_minute").iloc[-1]
                              m1["quote_0050"] = {
                                  key: scalar(row.get(key))
                                  for key in ("_minute", "open", "high", "low", "close", "volume")
                              }
              except Exception as exc:
                  m1["error"] = type(exc).__name__

          vwap_rows = list((bundle or {}).get("vwap") or [])
          sr_rows = list((bundle or {}).get("sr") or [])
          events = [safe_event("VWAP", row) for row in vwap_rows]
          events.extend(safe_event("SR", row) for row in sr_rows)
          events.sort(key=lambda row: (row["time"], row["stock_id"], row["kind"]))

          report = {
              "ok": (
                  health is not None
                  and health.get("status") == "ok"
                  and health.get("collector") != "error"
                  and m1["file_exists"]
                  and m1["latest_minute"] is not None
                  and m1["freshness_ok"]
              ),
              "generated_at": now.isoformat(timespec="seconds"),
              "trading_date": today,
              "health": health,
              "health_error": health_error,
              "gateway": gateway,
              "gateway_error": gateway_error,
              "bundle_error": bundle_error,
              "m1": m1,
              "signals": {
                  "vwap_count": len(vwap_rows),
                  "sr_count": len(sr_rows),
                  "latest_time": max((row["time"] for row in events), default=None),
                  "latest_events": events[-20:],
              },
          }
          print(json.dumps(report, ensure_ascii=False, separators=(",", ":")))
          PY
          REMOTE
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ] || ! python -m json.tool diagnostic.json >/dev/null 2>&1; then
            printf '{"ok":false,"error":"ssh_or_diagnostic_failed"}\n' > diagnostic.json
          fi
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"

      - name: Check public gateway
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen

          result = {"ok": False, "status": None, "error": None}
          try:
              with urlopen("https://day-trade.just1stock.com/health", timeout=15) as response:
                  body = json.load(response)
                  result.update(ok=response.status == 200 and body.get("status") == "ok", status=response.status)
          except Exception as exc:
              result["error"] = f"{type(exc).__name__}: {exc}"[:180]
          with open("public-health.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, ensure_ascii=False)
          PY

      - name: Render report
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open("diagnostic.json", encoding="utf-8") as handle:
              data = json.load(handle)
          with open("public-health.json", encoding="utf-8") as handle:
              public = json.load(handle)

          def cell(value):
              if value is None or value == "":
                  return "-"
              return str(value).replace("|", "\\|").replace("\n", " ")

          def percent(coverage):
              arrived = int((coverage or {}).get("arrived") or 0)
              total = int((coverage or {}).get("total") or 0)
              return f"{arrived}/{total} ({arrived / total:.1%})" if total else f"{arrived}/{total}"

          now = datetime.now(ZoneInfo("Asia/Taipei")).isoformat(timespec="seconds")
          lines = [
              "# Oracle 盤中診斷（最新）",
              "",
              f"- 報告時間：{cell(data.get('generated_at') or now)}",
              f"- 交易日期：{cell(data.get('trading_date'))}",
              f"- 整體狀態：{'正常' if data.get('ok') and public.get('ok') else '異常／資料不足'}",
              f"- 執行紀錄：{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "",
          ]

          if data.get("error"):
              lines.extend([f"診斷失敗：`{cell(data['error'])}`", ""])
          else:
              health = data.get("health") or {}
              gateway = data.get("gateway") or {}
              m1 = data.get("m1") or {}
              signals = data.get("signals") or {}
              lines.extend([
                  "## 服務與資料流",
                  "",
                  "| 項目 | 值 |",
                  "|---|---|",
                  f"| API | {cell(health.get('status'))} |",
                  f"| Caddy → backend | {cell(gateway.get('status') or data.get('gateway_error'))} |",
                  f"| 公開 HTTPS | {'正常' if public.get('ok') else cell(public.get('error') or public.get('status'))} |",
                  f"| Collector | {cell(health.get('collector'))} / {cell(health.get('message'))} |",
                  f"| SSE clients | {cell(health.get('sse_clients'))} |",
                  f"| 最新分鐘涵蓋率 | {percent(health.get('coverage'))} |",
                  f"| 版本 | {cell(health.get('version'))} |",
                  "",
                  "## 當日 M1 報價",
                  "",
                  "| 項目 | 值 |",
                  "|---|---|",
                  f"| 檔案存在 | {cell(m1.get('file_exists'))} |",
                  f"| 資料筆數 | {cell(m1.get('rows'))} |",
                  f"| 股票數 | {cell(m1.get('stocks'))} |",
                  f"| 分鐘數 | {cell(m1.get('minutes'))} |",
                  f"| 第一分鐘 | {cell(m1.get('first_minute'))} |",
                  f"| 最新分鐘 | {cell(m1.get('latest_minute'))} |",
                  f"| 最新分鐘股票數 | {cell(m1.get('latest_minute_stocks'))} |",
                  f"| 最新資料延遲（秒） | {cell(m1.get('latest_delay_seconds'))} |",
                  f"| 資料新鮮度 | {'正常' if m1.get('freshness_ok') else '異常'} |",
                  f"| 全市場完全缺少分鐘數 | {cell(m1.get('missing_market_minutes_count'))} |",
                  f"| 最近缺少的分鐘 | {cell(', '.join(m1.get('missing_market_minutes') or []))} |",
                  "",
              ])
              quote = m1.get("quote_0050") or {}
              lines.extend([
                  "### 0050 最新報價",
                  "",
                  "| 時間 | 開 | 高 | 低 | 收 | 量 |",
                  "|---|---:|---:|---:|---:|---:|",
                  f"| {cell(quote.get('_minute'))} | {cell(quote.get('open'))} | {cell(quote.get('high'))} | {cell(quote.get('low'))} | {cell(quote.get('close'))} | {cell(quote.get('volume'))} |",
                  "",
                  "## VWAP / SR 訊號",
                  "",
                  f"- VWAP 事件：{cell(signals.get('vwap_count'))}",
                  f"- SR 事件：{cell(signals.get('sr_count'))}",
                  f"- 最新訊號時間：{cell(signals.get('latest_time'))}",
                  "",
                  "| 類型 | 時間 | 股票 | 方向 | SR | 價格 | VWAP |",
                  "|---|---|---|---|---|---:|---:|",
              ])
              for event in signals.get("latest_events") or []:
                  stock = f"{event.get('stock_id', '')} {event.get('name', '')}".strip()
                  lines.append(
                      f"| {cell(event.get('kind'))} | {cell(event.get('time'))} | {cell(stock)} | "
                      f"{cell(event.get('direction'))} | {cell(event.get('sr_kind'))} | "
                      f"{cell(event.get('price'))} | {cell(event.get('vwap'))} |"
                  )
              lines.append("")

          report = "\n".join(lines)
          with open("report.md", "w", encoding="utf-8") as handle:
              handle.write(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(report)
          PY

      - name: Publish latest report
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          issue_number=""
          if [ "${EVENT_NAME}" = "issue_comment" ]; then
            issue_number="${EVENT_ISSUE_NUMBER}"
          else
            issue_number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
              --search 'Oracle 盤中診斷 in:title' --json number,title \
              --jq '.[] | select(.title == "Oracle 盤中診斷") | .number' | head -n 1)"
          fi
          if [ -z "${issue_number}" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title 'Oracle 盤中診斷' --body-file report.md
          else
            gh issue edit "${issue_number}" --repo "${GITHUB_REPOSITORY}" \
              --body-file report.md
          fi

      - name: Mark failed diagnostics
        if: steps.collect.outputs.exit_code != '0'
        run: exit 1
