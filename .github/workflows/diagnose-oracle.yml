name: Diagnose Oracle Collector

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: oracle-collector-maintenance
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 12 &&
       contains(fromJSON('["/diagnose","/restart-collector"]'), github.event.comment.body) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORACLE_HOST: ${{ vars.ORACLE_HOST || '129.225.130.75' }}
      ORACLE_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
      ORACLE_PORT: ${{ vars.ORACLE_PORT || '22' }}
      ORACLE_DEPLOY_PATH: ${{ vars.ORACLE_DEPLOY_PATH || '/home/ubuntu/vwap' }}

    steps:
      - name: Configure SSH
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${ORACLE_SSH_PRIVATE_KEY}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${ORACLE_SSH_PRIVATE_KEY}" > ~/.ssh/oracle_vwap
          chmod 600 ~/.ssh/oracle_vwap
          if [ -n "${ORACLE_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${ORACLE_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${ORACLE_PORT}" -H "${ORACLE_HOST}" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Diagnose or restart collector
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          remote_env="$(printf 'DEPLOY_PATH=%q COMMAND=%q' "${ORACLE_DEPLOY_PATH}" "${COMMAND:-/diagnose}")"
          ssh -i ~/.ssh/oracle_vwap \
            -p "${ORACLE_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${ORACLE_USER}@${ORACLE_HOST}" \
            "${remote_env} bash -s" <<'REMOTE'
          set -euo pipefail
          echo '### Runtime inventory'
          echo "configured_path=${DEPLOY_PATH} exists=$([ -d "${DEPLOY_PATH}" ] && echo true || echo false)"
          find /home/ubuntu -maxdepth 4 -type f \
            \( -name 'docker-compose*.yml' -o -name 'compose.yml' -o -name 'compose.yaml' \) \
            -print 2>/dev/null | sort
          docker ps -a --format 'name={{.Names}} status={{.Status}} image={{.Image}}'
          systemctl --no-pager --type=service --all 2>/dev/null \
            | grep -Ei 'vwap|market|collector|fubon' || true

          compose_file=""
          if [ -f /home/ubuntu/market-data-collector/docker-compose.yml ]; then
            compose_file=/home/ubuntu/market-data-collector/docker-compose.yml
          elif [ -f "${DEPLOY_PATH}/docker-compose.oracle.yml" ]; then
            compose_file="${DEPLOY_PATH}/docker-compose.oracle.yml"
          else
            compose_file="$(find /home/ubuntu -maxdepth 4 -type f \
              \( -name 'docker-compose*.yml' -o -name 'compose.yml' -o -name 'compose.yaml' \) \
              -print 2>/dev/null | head -n 1)"
          fi

          backend_id=""
          if [ -n "${compose_file}" ]; then
            echo "### Docker compose status (${compose_file})"
            docker compose -f "${compose_file}" ps || true
            backend_id="$(docker compose -f "${compose_file}" ps -q backend 2>/dev/null || true)"
            if [ -z "${backend_id}" ]; then
              backend_id="$(docker compose -f "${compose_file}" ps -q collector 2>/dev/null || true)"
            fi
          fi
          if [ -z "${backend_id}" ]; then
            backend_id="$(docker ps -aq --filter 'name=collector' | head -n 1)"
          fi
          if [ -z "${backend_id}" ]; then
            backend_id="$(docker ps -aq --filter 'name=vwap' | head -n 1)"
          fi
          if [ -z "${backend_id}" ]; then
            echo 'collector container is missing'
            exit 1
          fi

          if [ "${COMMAND}" = "/restart-collector" ]; then
            docker restart "${backend_id}"
            sleep 20
          fi

          echo '### Container state'
          docker inspect --format 'status={{.State.Status}} started={{.State.StartedAt}} restarts={{.RestartCount}} oom={{.State.OOMKilled}}' "${backend_id}"
          docker inspect --format 'health={{json .State.Health}}' "${backend_id}"
          docker inspect --format 'workdir={{.Config.WorkingDir}} command={{json .Config.Cmd}} healthcheck={{json .Config.Healthcheck}}' "${backend_id}"
          docker inspect --format 'mounts={{json .Mounts}}' "${backend_id}"

          if [ -d /home/ubuntu/market-data-collector ]; then
            echo '### Collector source version'
            git -C /home/ubuntu/market-data-collector status --short --branch 2>/dev/null || true
            git -C /home/ubuntu/market-data-collector log -5 --oneline 2>/dev/null || true
            find /home/ubuntu/market-data-collector -maxdepth 3 -type f \
              ! -name '.env' ! -path '*/.git/*' -print | sort | head -n 200
          fi

          echo '### Runtime checks'
          docker exec -i "${backend_id}" python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from urllib.request import urlopen
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Taipei"))
          today = now.strftime("%Y-%m-%d")
          env_names = [
              "FUBON_ID", "FUBON_API_KEY", "FUBON_CERT_B64", "FUBON_CERT_PASS",
              "HF_REPO_ID", "HF_TOKEN", "HF_LIVE_M1_UPLOAD",
          ]
          result = {
              "now": now.isoformat(timespec="seconds"),
              "env_present": {name: bool(os.environ.get(name)) for name in env_names},
          }
          try:
              import inspect
              from importlib.metadata import distribution, version
              from fubon_neo.sdk import build_websocket_client, build_websocket_config
              result["packages"] = {
                  name: version(name)
                  for name in ("fubon-neo", "fugle-marketdata")
              }
              result["websocket_builder"] = {
                  "signature": str(inspect.signature(build_websocket_client)),
                  "source": inspect.getsource(build_websocket_client),
                  "config_source": inspect.getsource(build_websocket_config),
                  "fubon_requires": distribution("fubon-neo").requires,
              }
          except Exception as exc:
              result["websocket_builder_error"] = f"{type(exc).__name__}: {exc}"
          try:
              with urlopen("http://127.0.0.1:8000/health", timeout=10) as response:
                  result["health"] = json.load(response)
          except Exception as exc:
              result["health_error"] = type(exc).__name__

          path = Path(f"/app/db/m1_live/{today}.parquet")
          result["m1"] = {"exists": path.exists(), "size": path.stat().st_size if path.exists() else 0}
          if path.exists():
              try:
                  import pandas as pd
                  frame = pd.read_parquet(path, columns=["stock_id", "date"])
                  dates = pd.to_datetime(frame["date"], errors="coerce")
                  result["m1"].update(
                      rows=len(frame),
                      stocks=int(frame["stock_id"].astype(str).nunique()),
                      latest=str(dates.max()),
                  )
              except Exception as exc:
                  result["m1"]["error"] = type(exc).__name__
          print(json.dumps(result, ensure_ascii=False))
          PY

          echo '### Relevant backend logs'
          docker logs --since=12h --tail=500 "${backend_id}" 2>&1 \
            | grep -Ei '富邦|Fubon|collector|WebSocket|訂閱|登入|HF M1|upload|上傳|error|exception|fail|timeout|killed|oom' \
            | tail -n 240 || true
          echo '### Raw recent logs'
          docker logs --since=30m --tail=240 "${backend_id}" 2>&1 || true
          REMOTE
