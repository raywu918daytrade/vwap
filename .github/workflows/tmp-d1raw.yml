name: tmp d1 raw
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/tmp-d1raw.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      HF_REPO_ID: ${{ secrets.HF_REPO_ID || vars.HF_REPO_ID || 'raywu918daytrade/daytrade' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Download
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          pats = [f"db/{f}/*" for f in ("adjustment_day", "adjustment_factor", "tick_adjust_factor", "tickers", "d1", "d1_flags", "adjustment_day_flags")]
          snapshot_download(os.environ["HF_REPO_ID"], repo_type="dataset", local_dir=".", allow_patterns=pats,
                            token=os.environ.get("HF_TOKEN") or None)
          PY
      - name: Export
        working-directory: backend
        run: |
          python - <<'PY' 2>&1 | tee db/d1_raw.log
          from data.adjustment_query import load_pattern_day
          from pattern.vwap_sr_scan import stock_ids_for_universe
          ids = stock_ids_for_universe("daytrade")
          d = load_pattern_day(start_date="2019-06-01")
          d["stock_id"] = d["stock_id"].astype(str)
          d = d[d["stock_id"].isin(ids)]
          print(d.columns.tolist())
          cols = [c for c in ("stock_id", "date", "open", "high", "low", "close", "volume") if c in d.columns]
          d = d[cols]
          for c in cols[2:]:
              d[c] = d[c].astype("float32")
          d.to_parquet("db/d1_raw.parquet", index=False, compression="zstd")
          print(len(d), d["stock_id"].nunique(), d["date"].min(), d["date"].max())
          PY
      - name: Commit
        if: always()
        run: |
          mkdir -p tmp-charts && cp backend/db/d1_raw.* tmp-charts/ || true
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add tmp-charts && git commit -m "tmp d1 raw"
          for i in 1 2 3 4 5 6; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*7)); done
