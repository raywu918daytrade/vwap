name: tmp key price data
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/tmp-keyprice.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        year: ["d1", "2020", "2021", "2022", "2023", "2024", "2025", "2026"]
    permissions:
      contents: write
    env:
      HF_REPO_ID: ${{ secrets.HF_REPO_ID || vars.HF_REPO_ID || 'raywu918daytrade/daytrade' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Download
        working-directory: backend
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          y = os.environ["YEAR"]
          pats = [f"db/{f}/*" for f in ("adjustment_day", "adjustment_factor", "tick_adjust_factor", "tickers", "d1", "d1_flags", "adjustment_day_flags")]
          if y != "d1":
              pats.append(f"db/m1/{y}_*")
          snapshot_download(os.environ["HF_REPO_ID"], repo_type="dataset", local_dir=".", allow_patterns=pats,
                            token=os.environ.get("HF_TOKEN") or None)
          PY
      - name: Build
        working-directory: backend
        env:
          YEAR: ${{ matrix.year }}
        run: |
          mkdir -p out
          if [ "$YEAR" = "d1" ]; then
          python - <<'PY' 2>&1 | tee out/d1_raw.log
          from data.adjustment_query import load_pattern_day
          from pattern.vwap_sr_scan import stock_ids_for_universe
          ids = stock_ids_for_universe("daytrade")
          d = load_pattern_day(start_date="2019-06-01")
          d["stock_id"] = d["stock_id"].astype(str)
          d = d[d["stock_id"].isin(ids)][["stock_id", "date", "open", "high", "low", "close", "volume"]]
          for c in ("open", "high", "low", "close", "volume"):
              d[c] = d[c].astype("float32")
          d["date"] = d["date"].dt.strftime("%Y-%m-%d")
          d.to_parquet("out/d1_raw.parquet", index=False, compression="zstd")
          print(len(d), d["stock_id"].nunique(), d["date"].min(), d["date"].max())
          PY
          else
          python -m scripts.build_m5_hl --days ../tmp-charts/stockdays.parquet --from-month $YEAR-01 --to-month $YEAR-12 --out out/m5_hl_$YEAR.parquet 2>&1 | tee out/m5_hl_$YEAR.log
          fi
      - name: Commit
        if: always()
        run: |
          mkdir -p tmp-charts && cp backend/out/* tmp-charts/ || true
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add tmp-charts && git commit -m "tmp key price data ${{ matrix.year }}"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*9)); done
