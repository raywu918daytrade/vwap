name: tmp gap fade report
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/tmp-gap-fade-report.yml", "backend/scripts/gap_fade_report.py"]
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_REPO_ID: ${{ secrets.HF_REPO_ID || vars.HF_REPO_ID || 'raywu918daytrade/daytrade' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Download D1 and M1 bars
        working-directory: backend
        run: |
          python -m scripts.sync_market_db_from_hf \
            --only m1 m5_std d1 adjustment_day tickers adjustment_factor tick_adjust_factor vwap_signals vwap_activity d1_flags adjustment_day_flags \
            --history-months 14 --intraday-months 4 --no-prune
      - name: Report
        working-directory: backend
        run: python -m scripts.gap_fade_report --train 2026-07-01 2026-08-31 --test 2026-09-01 2026-10-08 --window 10:00 13:00
