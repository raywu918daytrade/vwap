name: tmp trade stats report
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/tmp-trade-stats-report.yml", "backend/scripts/trade_stats_report.py", "backend/scripts/combo_report.py", "backend/scripts/d1_div_vwap_report.py"]
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      HF_REPO_ID: ${{ secrets.HF_REPO_ID || vars.HF_REPO_ID || 'raywu918daytrade/daytrade' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt matplotlib
      - name: Download signals and M1 bars
        working-directory: backend
        run: |
          python -m scripts.sync_market_db_from_hf \
            --only m1 m5_std d1 adjustment_day tickers adjustment_factor tick_adjust_factor vwap_signals vwap_activity d1_flags adjustment_day_flags \
            --history-months 14 --intraday-months 4 --no-prune
      - name: Report
        working-directory: backend
        run: python -m scripts.d1_div_vwap_report --from-date 2026-07-01 --to-date 2026-10-08 --min-atr 0.05 --min-vol5-pr 0.5 --chart-dir db/charts_c
      - name: Commit charts to branch
        run: |
          mkdir -p tmp-charts && cp backend/db/charts_c/*.png tmp-charts/
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add tmp-charts && git commit -m "tmp charts" && git push origin HEAD:${{ github.ref_name }}
