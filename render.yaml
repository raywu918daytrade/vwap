services:
  - type: web
    name: vwap
    runtime: docker
    branch: render
    region: singapore
    plan: free
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TZ
        value: Asia/Taipei
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RUNTIME_PROFILE
        value: render-reader
      - key: HF_DATA_MODE
        value: on-demand
      - key: REQUIRE_DATA_READY
        value: "1"
      - key: CHART_CACHE_MONTHS
        value: "12"
      - key: HF_HOME
        value: /app/.cache/huggingface
      - key: HF_HUB_DISABLE_XET
        value: "1"
      - key: HF_DOWNLOAD_WORKERS
        value: "4"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: VECLIB_MAXIMUM_THREADS
        value: "1"
      - key: ARROW_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: FUBON_BACKFILL_WORKERS
        value: "2"
      - key: CACHE_PREWARM_MONTHS
        value: "1"
      - key: CACHE_PREWARM_STARTUP_MONTHS
        value: "0"
      - key: CACHE_PREWARM_STARTUP_LIST_DATES
        value: "0"
      - key: CACHE_PREWARM_STARTUP_CHART_DATES
        value: "0"
      - key: CACHE_PREWARM_CHART_MONTHS
        value: "0"
      - key: CACHE_PREWARM_CHART_DATES
        value: "0"
      - key: CACHE_PREWARM_CHART_ROWS
        value: "16"
      - key: VWAP_BUNDLE_DISK_CACHE
        value: "1"
      - key: PATTERN_SCAN_DISK_CACHE
        value: "1"
      - key: PATTERN_DETAIL_DISK_CACHE
        value: "1"
      - key: WATCHLIST_QUOTES
        value: "0050"
      - key: TIDB_DAY_TRADE_READ
        value: "1"
      - key: TIDB_DAY_TRADE_CHART_READ
        value: "1"
      - key: HF_REPO_ID
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: TIDB_DAY_TRADE_DATABASE_URL
        sync: false
