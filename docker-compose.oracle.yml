name: vwap

services:
  backend:
    image: vwap-app:local
    platform: linux/amd64
    mem_limit: 448m
    mem_reservation: 256m
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
      HF_HOME: /app/.cache/huggingface
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      ARROW_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
      FUBON_BACKFILL_WORKERS: "2"
    volumes:
      - ./backend/db:/app/db
      - ./backend/log:/app/log
      - ./backend/logs:/app/logs
      - ./backend/.cache:/app/.cache
    ports:
      - "${HTTP_PORT:-80}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
