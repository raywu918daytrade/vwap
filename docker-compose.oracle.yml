name: vwap

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      TZ: Asia/Taipei
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backend:
    image: vwap-app:local
    platform: linux/amd64
    mem_limit: 448m
    mem_reservation: 256m
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
      HF_HOME: /app/.cache/huggingface
      HF_DATA_MODE: on-demand
      CHART_CACHE_MONTHS: "12"
      HF_DOWNLOAD_WORKERS: "4"
      REQUIRE_DATA_READY: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      ARROW_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
      FUBON_BACKFILL_WORKERS: "2"
    volumes:
      - ./backend/db:/app/db
      - ./backend/log:/app/log
      - ./backend/logs:/app/logs
      - ./backend/.cache:/app/.cache
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  gha-trigger:
    image: vwap-app:local
    platform: linux/amd64
    mem_limit: 48m
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "main.oracle_gha_trigger"]

volumes:
  caddy_data:
  caddy_config:
